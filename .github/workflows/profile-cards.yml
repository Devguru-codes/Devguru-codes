# Regenerates the stats, top-languages and snake SVGs in profile/ once a day.
# The public github-readme-stats instance is paused, so the cards are built here instead.
name: Profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # fail_on_error + continue-on-error: a failed fetch keeps yesterday's card instead of committing an error card.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: '{"username":"${{ github.repository_owner }}","show_icons":true,"hide_rank":true,"include_all_commits":true,"hide_border":true,"bg_color":"00000000","title_color":"A371F7","icon_color":"2F81F7","text_color":"8B949E","custom_title":"GitHub stats"}'
          path: profile/stats.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Notebook outputs and exported HTML reports would otherwise swamp the source languages.
      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: '{"username":"${{ github.repository_owner }}","layout":"compact","langs_count":8,"hide":"jupyter notebook,html,tex,bibtex style","hide_border":true,"bg_color":"00000000","title_color":"A371F7","text_color":"8B949E"}'
          path: profile/top-langs.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-light&color_snake=#A371F7
            profile/snake-dark.svg?palette=github-dark&color_snake=#A371F7

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "chore: refresh profile cards" || exit 0
          git push
